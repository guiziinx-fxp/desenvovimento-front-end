<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anatomia das Tags para html</title>
</head>
<body>
    <h1>anatomia das Tags</h1>
    <p>
        As tags em HTML são os elementos básicos que compõem 
        um página web. Cada tag tem uma estrura especifica e 
        desempenha um papael importante na organização e 
        apresentação do conteúdo. 
    </p>
    <p>
        este é um exemplo de parágrafo que pode conter 
        <strong> texto em negrito </strong>
        ou <em> texto em itálico</em> 
    </p>
</body>
</html>
