<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo: Div, br e hr</title>

    <style>
        div{ 
            font-size: 28px;
            text-align: center;
            padding: 20px;
            margin: 20px;
            border-radius: 10px;
        
        }
        #principal {
            background-color: rgb(0, 0, 0);
            border: 5px solid rgb(172, 7, 7);
            color: rgb(255, 254, 254);
        }
        #secundario {
            background-color: rgb(255, 251, 251);
            border: 5px solid rgb(172, 7, 7);
            color: rgb(0, 0, 0);
        }
        hr {
            border: none;
            border-top: 5px solid rgb(0, 4, 255);
            
            width: 90%;
        }
    </style>
</head>
<body>
    <div id = "principal">
        Esta é a primeira linha.
        <br>
        Esta é a segunda linha. 
    </div>
    <hr>
    <div id = "secundario">
        Esta é outra divisão da página.
        <br>
        Aqui comça uma nova linha.
    </div>
</body>
</html>
